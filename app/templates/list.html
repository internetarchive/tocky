<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List | Tocky</title>

    <style>
        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
        }
        [v-cloak] {
            display: none;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
</head>

<body>
    <div id="app" v-cloak>
        <tocky-header></tocky-header>
        <p-data-table
            size="small"
            scrollable 
            data-key="id"
            :loading="loading"
            :value="records"

            :filters="filters"
            filter-display="menu"
            lazy
            @filter="handleFilter"
        >
            <p-column field="id" header="ID"></p-column>
            <p-column field="assignee" header="Assignee"></p-column>
            <p-column field="created" header="Created"></p-column>
            <p-column field="state" header="State">
                <template #body="{ data }">
                    <p-tag v-if="data.state === 'Done'" value="Done" severity="success"></p-tag>
                    <p-tag v-else-if="data.state === 'Errored'" value="Errored" severity="danger"></p-tag>
                    <p-tag v-else :value="data.state" severity="info"></p-tag>
                </template>
                <template #filter="{ filterModel, filterCallback }">
                    <p-multi-select
                        v-model="filterModel.value"
                        @change="filterCallback()"
                        :options="['To Detect', 'Detecting', 'To Extract', 'Extracting', 'To Review', 'Reviewing', 'Done', 'Errored']"
                        placeholder="Filter"
                        :showClear="true"
                    ></p-multi-select>
                </template>
            </p-column>
            <p-column field="record.ocaid" header="IA ID">
                <template #body="{ data }">
                    
                    <p-button-group>
                        <p-button small link as="a" :href="`https://openlibrary.org/ia/${data.record.ocaid}`" target="_blank" title="Find on OpenLibrary">
                            <img src="https://openlibrary.org/favicon.ico" alt="" style="width: 16px; height: 16px;">
                        </p-button>
                        <p-button small link as="a" :href="`https://archive.org/details/${data.record.ocaid}`" target="_blank" title="View on Archive.org">
                            <img src="https://archive.org/favicon.ico" alt="" style="width: 16px; height: 16px;">
                            {{data.record.ocaid}}
                        </p-button>
                    </p-button-group>
                </template>
            </p-column>
            <p-column field="record.human_validation" header="Human Validation">
                <template #filter="{ filterModel, filterCallback }">
                    <p-multi-select
                        v-model="filterModel.value"
                        @change="filterCallback()"
                        :options="humanValidationOptions"
                        placeholder="Filter"
                        style="min-width: 12rem"
                        :showClear="true"
                    ></p-multi-select>
                </template>
            </p-column>
            <p-column field="record" header="Record">
                <template #body="{ data }">
                    <p-button text size="small" @click="showFullRecord(data)">View JSON</p-button>
                </template>
            </p-column>
            <p-column header="Actions">
                <template #body="{ data }">
                    <p-button link as="a" size="small" :href="`[[ config.env.TOCKY_APPLICATION_ROOT ]]/review/${data.id}`" target="_blank" >Review</p-button>
                </template>
            </p-column>
        </p-data-table>

        <p-dialog v-model:visible="dialogVisible" header="Full Record" :modal="true" :style="{ width: '50vw' }">
            <pre>{{ fullRecord }}</pre>
        </p-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes/umd/aura.min.js"></script>
    <script>
        function readFromCookie(key) {
            const cookies = document.cookie.split(';');
            for (const cookie of cookies) {
                const [name, value] = cookie.split('=');
                if (name.trim() === key) {
                    return value;
                }
            }
            return null;
        }
        function setCookie(key, value) {
            document.cookie = `${key}=${value}`;
        }

        function getApiKey(ask = true) {
            const cookie = readFromCookie('TOCKY_API_KEY');
            if (!cookie && ask) {
                const providedKey = prompt("Tocky API key");
                if (providedKey) {
                    setCookie('TOCKY_API_KEY', providedKey);
                    return providedKey;
                }
            }
            return cookie;
        }
        window.app = Vue.createApp({
            data() {
                return {
                    authenticated: !!getApiKey(false),
                    nav_options: [
                        { label: 'List', url: '/list', icon: 'pi pi-list' },
                        { label: 'Submit', url: '/submit', icon: 'pi pi-plus' },
                    ],

                    records: [],
                    limit: 50,
                    offset: 0,
                    dialogVisible: false,
                    fullRecord: '',
                    loading: false,

                    filters: {
                        'state': {
                            value: [],
                            matchMode: 'in'
                        },
                        'record.human_validation': {
                            value: [],
                            matchMode: 'in'
                        }
                    },

                    humanValidationOptions: [
                        "Perfect",
                        "Near Perfect",
                        "Good",
                        "Ok",
                        "Safe Wrong",
                        "Incomplete",
                        "Wrong",
                    ],

                };
            },
            methods: {
                authenticate() {
                    if (this.authenticated) {
                        const newKey = prompt("Tocky API key", getApiKey(false));
                        if (newKey !== null) {
                            setCookie('TOCKY_API_KEY', newKey);
                        }
                    } else {
                        getApiKey(true);
                    }
                    this.authenticated = !!getApiKey(false);
                },
                async fetchData() {
                    this.loading = true;
                    const params = new URLSearchParams({
                        limit: this.limit,
                        offset: this.offset,
                    });
                    for (const [key, value] of Object.entries(this.filters)) {
                        if (value.value.length > 0) {
                            params.append(key, value.value.join('|'));
                        }
                    }
                    const response = await fetch(`[[ config.env.TOCKY_APPLICATION_ROOT ]]/api/list?${params}`);
                    this.records = await response.json();
                    this.loading = false;
                },
                showFullRecord(record) {
                    this.fullRecord = JSON.stringify(record, null, 2);
                    this.dialogVisible = true;
                },
                handleFilter(event) {
                    if (JSON.stringify(this.filters) === JSON.stringify(event.filters)) {
                        return;
                    }
                    this.filters = event.filters;
                    console.log('FILTER', event);
                    this.fetchData(event.filters);
                }
            },
            mounted() {
                this.fetchData();
            }
        });

        window.app.use(PrimeVue.Config, {
            theme: {
                preset: PrimeVue.Themes.Aura,
                options: {
                    prefix: 'p',
                    darkModeSelector: '.never',
                }
            }
        });

        window.app.component('p-data-table', PrimeVue.DataTable);
        window.app.component('p-column', PrimeVue.Column);
        window.app.component('p-column-group', PrimeVue.ColumnGroup);
        window.app.component('p-row', PrimeVue.Row);
        window.app.component('p-dialog', PrimeVue.Dialog);
        window.app.component('p-button', PrimeVue.Button);
        window.app.component('p-button-group', PrimeVue.ButtonGroup);
        window.app.component('p-tag', PrimeVue.Tag);
        window.app.component('p-multi-select', PrimeVue.MultiSelect);
        window.app.component('p-menu-bar', PrimeVue.Menubar);

        window.app.component('tocky-header', {
            template: `
                <p-menu-bar class="app-toolbar" :model="nav_options">
                    <template #start>
                        <h1>Tocky</h1>
                    </template>

                    <template #end>
                        <p-button size="small" :outlined="authenticated" @click="authenticate">
                            <i class="pi pi-key"></i>
                            {{ authenticated ? 'Edit Key' : 'Set Key' }}
                        </p-button>
                    </template>
                </p-menu-bar>
            `,
            data() {
                return {
                    authenticated: !!getApiKey(false),
                    nav_options: [
                        { label: 'List', url: '/list', icon: 'pi pi-list' },
                        { label: 'Submit', url: '/submit', icon: 'pi pi-plus' },
                    ],
                };
            },
            methods: {
                authenticate() {
                    if (this.authenticated) {
                        const newKey = prompt("Tocky API key", getApiKey(false));
                        if (newKey !== null) {
                            setCookie('TOCKY_API_KEY', newKey);
                        }
                    } else {
                        getApiKey(true);
                    }
                    this.authenticated = !!getApiKey(false);
                },
            },
        });

        window.app.mount("#app");
    </script>
</body>

</html>
