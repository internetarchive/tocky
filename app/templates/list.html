<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List | Tocky</title>

    <script>
        // Do this early to avoid flash of light theme
        if (localStorage.getItem('tocky--dark-mode') === 'true') {
            document.documentElement.classList.add('tocky-dark-mode');
        }
        window.TOCKY_CONF = [[ TOCKY_PUBLIC_CONFIG_JSON|safe ]];
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
    <style>
        [v-cloak] {
            display: none !important;
        }
        html, body {
            background-color: var(--p-content-background);
        }
        html.tocky-dark-mode {
            color-scheme: dark;
        }
        .flashing {
            animation: flashing 1.6s infinite;
        }

        @keyframes flashing {
            5% { opacity: 1; }
            45% { opacity: 1; }
            55% { opacity: 0; }
            95% { opacity: 0; }
        }

        td:nth-child(5) .tocky-copy-button {
            opacity: 0;
            transition: opacity 0.2s;
        }
        td:nth-child(5):hover .tocky-copy-button {
            opacity: 1;
        }

        .p-multiselect-list-container {
            scrollbar-width: thin;
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <tocky-header></tocky-header>
        <p-data-table
            size="small"
            scrollable 
            data-key="id"
            :loading="loading"
            :value="records"

            :filters="filters"
            filter-display="menu"
            lazy
            @filter="handleFilter"
        >
            <p-column field="id" header="ID"></p-column>
            <p-column field="assignee" header="Assignee"></p-column>
            <p-column field="created" header="Created"></p-column>
            <p-column field="state" header="State" :show-filter-match-modes="false">
                <template #body="{ data }">
                    <tocky-state-tag
                        :state="data.state"
                        :class="{'flashing': data.id in watchedRecords}"
                    ></tocky-state-tag>
                </template>
                <template #filter="{ filterModel, filterCallback }">
                    <p-multi-select
                        v-model="filterModel.value"
                        @change="filterCallback()"
                        :options="['To Detect', 'Detecting', 'To Extract', 'Extracting', 'To Review', 'Reviewing', 'Done', 'Errored']"
                        placeholder="Filter"
                        :showClear="true"
                    >
                        <template #option="{ option }">
                            <tocky-state-tag :state="option"></tocky-state-tag>
                        </template>
                    </p-multi-select>
                </template>
            </p-column>
            <p-column field="record.ocaid" header="IA ID">
                <template #body="{ data }">
                    <tocky-ia-link :ocaid="data.record.ocaid"></tocky-ia-link>
                </template>
            </p-column>
            <p-column field="record.status" header="Status" :show-filter-match-modes="false">
                <template #filter="{ filterModel, filterCallback }">
                    <p-multi-select
                        v-model="filterModel.value"
                        @change="filterCallback()"
                        :options="extractionStatusOptions"
                        placeholder="Filter"
                        style="min-width: 12rem"
                        :showClear="true"
                    ></p-multi-select>
                </template>
            </p-column>
            <p-column field="record.human_validation" header="Human Validation" :show-filter-match-modes="false">
                <template #filter="{ filterModel, filterCallback }">
                    <p-multi-select
                        v-model="filterModel.value"
                        @change="filterCallback()"
                        :options="humanValidationOptions"
                        placeholder="Filter"
                        style="min-width: 12rem"
                        :showClear="true"
                    ></p-multi-select>
                </template>

                <template #body="{ data }">
                    <span v-tooltip="data.record.comment">
                        {{ data.record.human_validation }}
                        <i v-if="data.record.comment" class="pi pi-comment"></i>
                    </span>
                </template>
            </p-column>
            <p-column field="record" header="Record">
                <template #body="{ data }">
                    <p-button text size="small" @click="showFullRecord(data)">View JSON</p-button>
                </template>
            </p-column>
            <p-column header="Actions">
                <template #body="{ data }">
                    <p-button text as="a" size="small" :href="`[[ TOCKY_APPLICATION_ROOT ]]/review/${data.id}`">Review</p-button>
                </template>
            </p-column>
        </p-data-table>

        <p-paginator
            :first="offset"
            :rows="limit"
            :total-records="max_id"
            @page="handlePageChange"
        ></p-paginator>

        <p-dialog v-model:visible="dialogVisible" header="Full Record" :modal="true" :style="{ width: '50vw' }">
            <pre>{{ fullRecord }}</pre>
        </p-dialog>
    </div>

    <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.js"></script>
    <script src="https://unpkg.com/primevue@4.0.5/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes@4.0.5/umd/aura.min.js"></script>
    <script src="[[ url_for('static', path='shared.js') ]]"></script>
    <script>
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        window.app = Vue.createApp({
            data() {
                const limit = hashParams.get('limit') ? parseFloat(hashParams.get('limit')) : 20;
                return {
                    max_id: 1000,

                    records: [],
                    watchedRecords: {},
                    watchedRecordsTimeout: null,
                    maxWatch: 3 * 60_000,
                    watchStart: 0,

                    dialogVisible: false,
                    fullRecord: '',
                    loading: false,

                    limit: limit,
                    offset: hashParams.get('offset') ? parseFloat(hashParams.get('offset')) :
                        hashParams.get('page') ? (parseFloat(hashParams.get('page')) - 1) * limit : 0,
                    filters: {
                        'state': {
                            value: (hashParams.get('state') || '').split('|'),
                        },
                        'record.status': {
                            value: (hashParams.get('record.status') || '').split('|'),
                        },
                        'record.human_validation': {
                            value: (hashParams.get('record.human_validation') || '').split('|'),
                        },
                        'batch_id': {
                            value: (hashParams.get('batch_id') || '').split('|'),
                        },
                    },

                    // Keep in sync with bulk_processor.py
                    extractionStatusOptions: [
                        "TOC Extracted",
                        "No TOC detected",
                        "Errored",
                        "Already has good TOC",
                        "TOC Validation: Unparseable TOC",
                        "TOC Validation: Label/Title Too Long",
                        "TOC Validation: No Numbers",
                        "TOC Validation: Not Enough Numbers",
                        "TOC Validation: Too Few Lines With Numbers",
                        "TOC Validation: Starts Too High",
                        "TOC Validation: End Too Low",
                    ],

                    humanValidationOptions: [
                        "Perfect",
                        "Near Perfect",
                        "Good",
                        "Ok",
                        "Safe Wrong",
                        "Incomplete",
                        "Wrong",
                    ],

                };
            },
            methods: {
                async apiList(params) {
                    const response = await fetch(`[[ TOCKY_APPLICATION_ROOT ]]/api/list?${new URLSearchParams(params).toString()}`);
                    return await response.json();
                },
                async fetchData() {
                    this.loading = true;
                    this.watchedRecords = {};
                    clearTimeout(this.watchedRecordsTimeout);

                    const params = {
                        limit: this.limit,
                        offset: this.offset,
                    };
                    for (const [key, value] of Object.entries(this.filters)) {
                        if (value.value?.length > 0) {
                            params[key] = value.value.join('|');
                        }
                    }

                    this.records = await this.apiList(params);
                    for (const [index, record] of this.records.entries()) {
                        if (record.state === 'Detecting' || record.state === 'Extracting') {
                            this.watchedRecords[record.id] = index;
                        }
                    }
                    this.watchStart = Date.now();
                    this.startWatching();
                    this.loading = false;
                },
                startWatching() {
                    const watchedRecordsIds = Object.keys(this.watchedRecords);
                    if (!watchedRecordsIds.length) {
                        return;
                    }

                    if (Date.now() - this.watchStart > this.maxWatch) {
                        for (const id of watchedRecordsIds) {
                            delete this.watchedRecords[id];
                        }
                        return;
                    }

                    this.watchedRecordsTimeout = setTimeout(async () => {
                        const records = await this.apiList({ id: watchedRecordsIds.join('|'), limit: watchedRecordsIds.length });
                        for (const record of records) {
                            if (record.id in this.watchedRecords && this.records[this.watchedRecords[record.id]].id === record.id) {
                                this.records[this.watchedRecords[record.id]] = record;
                            }

                            if (record.state !== 'Detecting' && record.state !== 'Extracting') {
                                delete this.watchedRecords[record.id];
                            }
                        }

                        this.startWatching();
                    }, 1000);
                },
                showFullRecord(record) {
                    this.fullRecord = JSON.stringify(record, null, 2);
                    this.dialogVisible = true;
                },
                handleFilter(event) {
                    if (JSON.stringify(this.filters) === JSON.stringify(event.filters)) {
                        return;
                    }
                    this.filters = event.filters;
                    this.offset = 0;
                    console.log('FILTER', event);
                    this.fetchData(event.filters);
                },
                handlePageChange(event) {
                    this.offset = event.first;
                    this.fetchData();
                },
            },
            watch: {
                limit(newLimit) {
                    hashParams.set('limit', newLimit);
                    window.location.hash = hashParams.toString();
                },
                offset(newOffset) {
                    const page = Math.floor(newOffset / this.limit);
                    hashParams.set('page', page + 1);
                    window.location.hash = hashParams.toString();
                },
                filters: {
                    handler(newFilters) {
                        for (const [key, value] of Object.entries(newFilters)) {
                            const values = (value.value || []).filter(v => !!v);
                            if (values.length) {
                                hashParams.set(key, values.join('|'));
                            } else {
                                hashParams.delete(key);
                            }
                        }
                        window.location.hash = hashParams.toString();
                    },
                    deep: true,
                },
            },
            async mounted() {
                await this.fetchData();
                // This is a hack to get the max id for the paginator without having
                // to do a separate request
                this.max_id = this.records.length ? this.records[0].id : 1000;
            }
        });

        TockyShared.registerComponents(window.app);
        window.app.mount("#app");
    </script>
</body>

</html>
