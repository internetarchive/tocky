<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review | Tocky</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.2/dist/semantic.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css" />
    <style>
        [v-cloak] {
            display: none;
        }

        #app {
            font-family: Avenir, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .page-ocr {
            border: 1px solid black;
            font-size: 10px;
        }

        iframe {
            width: 100%;
            border: 0;
            height: 100%;
        }

        #app>main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .p-tabpanels {
            flex: 1;
            overflow: auto;
        }
        .p-tabpanel {
            height: 100%;
        }
        .main-split {
            display: flex;
            overflow: hidden;
            flex: 1;
        }

        .main-split .left,
        .main-split .right {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .tocky-monaco-editor {
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .toolbar {
            display: flex;
            margin-bottom: 10px;
            gap: 10px;
            align-items: baseline;
        }
    </style>
</head>

<body>
    <div id="app" v-cloak>
        <tocky-header></tocky-header>
        <main v-if="current_toc">
            <div class="main-split">
                <p-tabs class="left" value="ocr">
                    <p-tab-list>
                        <p-tab value="ocr">OCR</p-tab>
                        <p-tab value="toc_pages">TOC Pages</p-tab>
                        <p-tab value="book">Book</p-tab>
                        <p-tab value="json">JSON</p-tab>
                    </p-tab-list>
                    <p-tab-panels>
                        <p-tab-panel value="ocr">
                            <pre
                                class="page-ocr"
                                v-for="page in current_toc.record.toc_raw_ocr"
                                :style="{ width: `${getCanvasWidth(page)}ch` }"
                            >{{page}}</pre>
                        </p-tab-panel>

                        <p-tab-panel value="toc_pages" style="overflow-y: auto; display: flex; gap: 8px; flex-direction: column; align-items: center;">
                            <img
                                v-for="(page, index) in current_toc.record.detected_toc"
                                :src="`[[ config.env.TOCKY_APPLICATION_ROOT ]]/ia_toc_img?id=${current_toc.id}&index=${index}`"
                                loading="lazy"
                                style="border-radius: 4px; flex-shrink: 0;"
                            />
                        </p-tab-panel>
                        <p-tab-panel value="book">
                            <iframe
                                :src="`https://archive.org/embed/${current_toc.record.ocaid}?admin=1#page/leaf${current_toc.record.detected_toc[0]}`"></iframe>
                        </p-tab-panel>
                        <p-tab-panel value="json">
                            <pre>{{JSON.stringify(current_toc, null, '  ')}}</pre>
                        </p-tab-panel>
                    </p-tab-panels>
                </p-tabs>
                <div class="right">
                    <p-toolbar style="padding: 0 10px;">
                        <template #start>
                            <p-button small text icon="pi pi-step-backward-alt" label="De-indent" @click="deIndentText"></p-button>
                            <p-button small text icon="pi pi-step-forward-alt" label="Indent" @click="indentText"></p-button>
                        </template>
                        <template #end>
                            <label style="display: flex; align-items: center; gap: 5px;">
                                <p-toggle-switch v-model="monacoWordWrapBool"></p-toggle-switch>
                                {{ monacoWordWrapBool ? 'Text wrap' : 'No Wrap' }}
                            </label>
                        </template>
                    </p-toolbar>
                    <vue-monaco-editor
                        class="tocky-monaco-editor"
                        v-model:value="corrected_toc"
                        language="plaintext"
                        :options="monacoOptions"
                        @mount="handleMonacoMount"
                    ></vue-monaco-editor>
                    <div class="toolbar">
                        <p-select
                            v-model="current_toc.record.human_validation"
                            :options="validationOptions"
                            placeholder="Select Validation"
                            style="min-width: 20ch;"
                        ></p-select>
                        <p-input-text placeholder="Comment..." v-model="current_toc.record.comment" style="flex: 1;"></p-input-text>
                    </div>
                    <p-toolbar>
                        <template #start>
                            <p-button
                                label="Submit corrections"
                                @click="submitCorrections"
                                :loading="submitCorrectionsLoading"
                                :text="!changesToSave"
                            ></p-button>
                            <p-button
                                label="Save to Open Library"
                                @click="saveToOL"
                                :disabled="!corrected_toc"
                                :loading="saveToOLLoading"
                                :text="!changedSinceOlSave"
                            ></p-button>
                        </template>
                    </p-toolbar>
                </div>
            </div>
        </main>
        <main class="ui basic segment" v-else>
            <i>No TOC loaded</i>
        </main>

        <p-toolbar>
            <template #start v-if="current_toc">
                <div>ID: #{{current_toc.id}}</div>
                <p-divider layout="vertical"></p-divider>
                <div>State: <tocky-state-tag :state="current_toc.state"></tocky-state-tag></div>
                <p-divider layout="vertical"></p-divider>
                <div>IA ID: <tocky-ia-link :ocaid="current_toc.record.ocaid"></tocky-ia-link></div>
                <p-divider layout="vertical"></p-divider>
                <div>Status: {{current_toc.record.status}}</div>
            </template>

            <template #end>
                <p-button
                    label="Get next TOC"
                    @click="getNextToc"
                    v-tooltip.top="`Get the next TOC to review`"
                ></p-button>
            </template>
        </p-menubar>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/primevue/umd/primevue.min.js"></script>
    <script src="https://unpkg.com/@primevue/themes/umd/aura.min.js"></script>
    <script src="[[ url_for('static', filename='shared.js') ]]"></script>

    <script src="https://unpkg.com/vue-demi@0.14.6/lib/index.iife.js"></script>
    <script src="https://unpkg.com/@monaco-editor/loader@1.4.0/lib/umd/monaco-loader.js"></script>
    <script src="https://unpkg.com/@guolao/vue-monaco-editor@1.5.4/lib/umd/monaco-vue.js"></script>

    <script type="module">
        const { VueMonacoEditor } = monaco_vue;

        window.app = Vue.createApp({
            components: {
                VueMonacoEditor,
            },
            data() {
                const m = location.pathname.match(/\/review\/(\d+)/);
                return {
                    specific_id: m ? parseFloat(m[1]) : null,
                    current_toc: null,
                    corrected_toc: null,
                    validationOptions: [
                        'Perfect',
                        'Near Perfect',
                        'Good',
                        'Ok',
                        'Safe Wrong',
                        'Incomplete',
                        'Wrong',
                    ],

                    lastSubmitValue: null,
                    submitCorrectionsLoading: false,
                    
                    lastSavedToOL: null,
                    saveToOLLoading: false,

                    monacoEditor: null,
                    monacoOptions: {
                        wordWrap: 'off',
                        minimap: {
                            enabled: false,
                        },
                    }
                };
            },

            computed: {
                monacoWordWrapBool: {
                    get() {
                        return this.monacoOptions.wordWrap === 'on';
                    },
                    set(value) {
                        this.monacoOptions.wordWrap = value ? 'on' : 'off';
                    }
                },

                changesToSave() {
                    return this.lastSubmitValue !== JSON.stringify(this.current_toc);
                },
                changedSinceOlSave() {
                    return this.lastSavedToOL !== JSON.stringify(this.corrected_toc);
                }
            },

            async mounted() {
                if (this.specific_id) {
                    const params = new URLSearchParams({ id: this.specific_id });
                    const resp = await fetch(`[[ config.env.TOCKY_APPLICATION_ROOT ]]/api/list?${params}`, {
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    }).then((r) => r.json());
                    this.current_toc = resp[0];
                    this.lastSubmitValue = JSON.stringify(this.current_toc);
                    this.corrected_toc = this.current_toc.record.corrected_toc || this.current_toc.record.structured_toc;
                }
            },

            methods: {
                getCanvasWidth(page) {
                    return Math.max(...page.split("\n").map((l) => l.length));
                },
                handleMonacoMount(editor) {
                    this.monacoEditor = editor;
                },
                async getNextToc() {
                    const example = {
                        "assignee": null,
                        "created": "2023-10-21 22:44:22",
                        "id": 1,
                        "record": {
                            "code version": "v2.D.0",
                            "completion_tokens": 181,
                            "detected_toc": [11],
                            "error": null,
                            "ocaid": "goingsolo00roal",
                            "prompt_tokens": 640,
                            "status": "TOC Extracted",
                            "structured_toc":
                                "\n* | The Voyage Out | II\n* | Dar es Salaam | 29\n* | Simba | 39\n* | The Green Mamba | 50\n* | The Beginning of the War | 59\n* | Mdisho of the Mwanumwezi | 74\n* | Flying Training | 84\n* | Survival | 101\n* | First Encounter with a Bandit | 124\n* | The Ammunition Ship | 142\n* | The Battle of Athens on the Twentieth of April | 147\n* | The Last Day but One | 156\n* | The Argos Fiasco | 174\n* | Palestine and Syria | 186\n* | Home | 200\n* | Maps |\n    ** Map 1 | East Africa | 10\n    ** Map 2 | The Eastern Mediterranean | 102",
                            "toc_raw_ocr": [
                                "                                       Contents                                                    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nThe Voyage Out                                                                                   II\nDar es Salaam                                                                                   29 \nSimba                                                                                            39\n\nThe Green Mamba                                                                                  So\n\nThe Beginning of the War                                                                         59\n\nMdisho of the Mwanumwezi                                                                         74\nFlying Training                                                                                 84 \n\nSurvival                                                                                       IOI \nFirst Encounter with a Bandit                                                                 124  \n\nThe Ammunition Ship                                                                            I42 \n\nThe Battle of Athens                 5  the Twentieth of April                                 I47 \nThe Last        Day      but One                                                               I56 \n\nThe Argos Fiasco                                                                               I74 \n\nPalestine and Syria                                                                            186 \nHome                                                                                          200  \n\n\n\n\n\n\n\n\n\n\n\nMaps                                                                                               \n\n I    East Africa                                                                                IO\n2     The Eastern Mediterranean                                                                I02 ",
                            ],
                        },
                        "state": "Todo",
                    };
                    /* Read the session cookie to determine assignee */
                    const assignee = document.cookie.match(/session=([^%]+)/)?.[1];
                    const params = new URLSearchParams({ assignee });
                    this.current_toc = await fetch(`[[ config.env.TOCKY_APPLICATION_ROOT ]]/pop?${params}`, {
                        headers: {
                            'Content-Type': 'application/json',
                            'X-API-Key': TockyShared.getApiKey(true)
                        }
                    }).then((r) => r.json());
                    this.lastSubmitValue = JSON.stringify(this.current_toc);
                    this.corrected_toc = this.current_toc.record.structured_toc;

                    if (!this.current_toc) {
                        alert("No more TOCs to review right now!");
                    }
                },
                async submitCorrections() {
                    this.submitCorrectionsLoading = true;

                    const body = Object.assign({}, this.current_toc.record);
                    if (this.corrected_toc != this.current_toc.record.structured_toc) {
                        body.corrected_toc = this.corrected_toc;
                    }
                    const params = new URLSearchParams();
                    const assignee = document.cookie.match(/session=([^%]+)/)?.[1];
                    if (assignee) {
                        params.append('assignee', assignee);
                    }
                    try {
                        await fetch(
                            `[[ config.env.TOCKY_APPLICATION_ROOT ]]/update/${this.current_toc.id}?${params}`,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "X-API-Key": TockyShared.getApiKey(true),
                                },
                                body: JSON.stringify(Object.assign({}, body, { state: 'Done' })),
                            },
                        );
                        this.lastSubmitValue = JSON.stringify(this.current_toc);
                    } finally {
                        this.submitCorrectionsLoading = false;
                    }
                },
                async saveToOL() {
                    this.saveToOLLoading = true;
                    // Always fetch latest from prod endpoint!
                    const rec = await fetch(
                        `https://openlibrary.org/ia/${this.current_toc.record.ocaid}.json`,
                    ).then((r) => r.json());
                    rec.table_of_contents = parseOlToc(this.corrected_toc);
                    rec._comment = 'Add TOC from Tocky';
                    this.lastSavedToOL = JSON.stringify(this.corrected_toc);
                    try {
                        await fetch(`${rec.key}.json`, {
                            method: "PUT",
                            credentials: "include",
                            body: JSON.stringify(rec),
                        });
                    } finally {
                        this.saveToOLLoading = false;
                    }
                },
                updateSelectedLines(editFn) {
                    function* range(start, end) {
                        for (let i = start; i <= end; i++) {
                            yield i;
                        }
                    }

                    const selections = this.monacoEditor.getSelections();
                    const selectedLineNums = new Set(selections.flatMap(s => Array.from(range(s.startLineNumber, s.endLineNumber))));
                    const lines = this.corrected_toc.split("\n");
                    
                    // Indent the selected lines
                    for (const i of selectedLineNums) {
                        lines[i - 1] = editFn(lines[i - 1]);
                    }

                    this.corrected_toc = lines.join("\n");
                },
                indentText() {
                    this.updateSelectedLines(line => line.replace(/^( *)(\**)/, ($0, $1, $2) => $1 + '    *' + $2));
                },
                deIndentText() {
                    this.updateSelectedLines(line => line.replace(/^( *)(\**)/, ($0, $1, $2) => $1.slice(0, -4) + ($2.length > 1 ? $2.slice(0, -1) : $2)));
                },
            },
        });

        TockyShared.registerComponents(window.app);
        window.app.mount("#app");

        class OlTocParseError extends Error { }
        function parseOlToc(tocString) {
            const tocEntries = [];
            const lines = tocString.trim().split("\n").map((l) => l.trim());

            for (const line of lines) {
                const parts = line.split("|");
                if (parts) {
                    const [label, title, pagenum] = parts;
                    if (!label.startsWith("*")) {
                        throw new OlTocParseError(`no stars: ${parts}`);
                    }
                    tocEntries.push({
                        level: label.trim().match(/^\*+/)[0].length,
                        label: label.replace(/^\*+\s*/g, "").trim(),
                        title: title.trim(),
                        pagenum: pagenum.trim(),
                    });
                } else {
                    throw new OlTocParseError("does not match pattern");
                }
            }

            return tocEntries;
        }
    </script>
</body>

</html>
