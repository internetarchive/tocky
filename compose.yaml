services:
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    env_file:
      - .env
    environment:
      - TOCKY_QUEUE_DB_PATH=/data/database.db
    ports:
      - "5000:5000"
    networks:
      - dbnet
    volumes:
      - queue_data:/data

networks:
  dbnet: {}

volumes:
  queue_data: {}
